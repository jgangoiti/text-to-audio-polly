name: Terraform

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write   # necesario para OIDC
  contents: read
  pull-requests: write  # para comentar el plan en el PR
env:
  TF_WORKING_DIR: terraform/environments/dev
  AWS_REGION: eu-west-1

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generar terraform.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat << 'TFVARS_EOF' > terraform.tfvars
          ${{ secrets.TFVARS_CONTENT }}
          TFVARS_EOF

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_iam_policy_name: ${{ secrets.TF_VAR_IAM_POLICY_NAME }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fallar si el plan falló
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production  # opcional: permite exigir aprobación manual en GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generar terraform.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat << 'TFVARS_EOF' > terraform.tfvars
          ${{ secrets.TFVARS_CONTENT }}
          TFVARS_EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_iam_policy_name: ${{ secrets.TF_VAR_IAM_POLICY_NAME }}
        run: terraform apply -auto-approve